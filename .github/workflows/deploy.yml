name: Deploy workspace

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY to apply D1 migrations and deploy the Worker
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm_production == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Configure the target D1 database
        env:
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          sed -i "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply legacy-school --remote
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
