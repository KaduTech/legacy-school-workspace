name = "legacy-school-workspace"
main = "src/worker.js"
compatibility_date = "2026-09-04"
workers_dev = false

routes = [
  { pattern = "legacy.kadutech.com", custom_domain = true }
]

[vars]
APP_ORIGIN = "https://legacy.kadutech.com"
BOOTSTRAP_ADMIN_EMAIL = "kadutechsolutions@gmail.com"
GOOGLE_CLIENT_ID = "847768257798-u43nv6pn63kolugomfm4sc04ao40biar.apps.googleusercontent.com"
GOOGLE_REDIRECT_URI = "https://legacy.kadutech.com/auth/google/callback"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

[[d1_databases]]
binding = "DB"
database_name = "legacy-school"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
